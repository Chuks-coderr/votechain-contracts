name: Deploy to Testnet

# ── Trigger ──────────────────────────────────────────────────────────────────
# Runs automatically on every push (merge) to main so testnet always reflects
# the latest main branch state. CI must pass first via the `needs: ci` gate
# in the deploy job. Closes #266.
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-testnet.yml'
      - 'scripts/deploy.sh'
  # Also allow manual dispatches for hotfix deployments
  workflow_dispatch:

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "22.8.2"

jobs:
  # ── CI gate ─────────────────────────────────────────────────────────────────
  # Re-run the full test suite so the deploy can only proceed when tests pass.
  # This satisfies the "gated on passing CI tests" acceptance criterion (#266).
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Contracts
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      wasm-tag: ${{ steps.meta.outputs.tags }}
      wasm-digest: ${{ steps.meta.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
            ${{ runner.os }}-cargo-

      - name: Cache Stellar CLI binary
        id: stellar-cli-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Build WASM contracts
        run: stellar contract build

      - name: Verify WASM binaries
        run: |
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          file target/wasm32-unknown-unknown/release/*.wasm

      - name: Generate build metadata
        id: meta
        run: |
          echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "git-sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          WASM_TAG="testnet-$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::8}"
          echo "tags=$WASM_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts-${{ steps.meta.outputs.tags }}
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testnet
      url: https://testnet.stellar.expert
    outputs:
      governance-contract-id: ${{ steps.deploy.outputs.governance-contract-id }}
      token-contract-id: ${{ steps.deploy.outputs.token-contract-id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deploy-
            ${{ runner.os }}-cargo-

      - name: Cache Stellar CLI binary
        id: stellar-cli-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Build WASM contracts
        run: stellar contract build

      - name: Configure Stellar CLI for testnet
        run: |
          mkdir -p ~/.stellar
          cat > ~/.stellar/networks.toml << 'NETWORKS_EOF'
          [[networks]]
          name = "testnet"
          rpc-url = "https://soroban-testnet.stellar.org"
          network-passphrase = "Test SDF Network ; September 2015"
          NETWORKS_EOF

      - name: Verify deployment prerequisites
        run: |
          echo "✓ Stellar CLI version:"
          stellar --version
          echo "✓ WASM contracts ready:"
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          echo "✓ Deployment config:"
          cat config/testnet.toml

      - name: Deploy contracts to testnet
        id: deploy
        env:
          SOROBAN_ACCOUNT: ${{ secrets.SOROBAN_ACCOUNT }}
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_SECRET_KEY }}
          DEPLOYMENT_ENV: testnet
        run: |
          set -euo pipefail

          if [[ -z "${SOROBAN_ACCOUNT:-}" ]]; then
            echo "❌ Error: SOROBAN_ACCOUNT secret not configured"
            exit 1
          fi
          if [[ -z "${SOROBAN_SECRET_KEY:-}" ]]; then
            echo "❌ Error: SOROBAN_SECRET_KEY secret not configured"
            exit 1
          fi

          echo "🚀 Starting deployment to testnet..."

          export SOROBAN_RPC_URL="https://soroban-testnet.stellar.org"
          export SOROBAN_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"

          chmod +x scripts/deploy.sh
          NETWORK=testnet ./scripts/deploy.sh 2>&1 | tee deployment.log

          # ── Extract deployed contract addresses from deploy.sh output ──
          # deploy.sh is expected to print lines such as:
          #   GOVERNANCE_CONTRACT_ID=C...
          #   TOKEN_CONTRACT_ID=C...
          # If the script writes them to .env.testnet, we source that instead.
          if [[ -f .env.testnet ]]; then
            # shellcheck source=/dev/null
            source .env.testnet
          else
            GOVERNANCE_CONTRACT_ID=$(grep -Po '(?<=GOVERNANCE_CONTRACT_ID=)\S+' deployment.log || true)
            TOKEN_CONTRACT_ID=$(grep -Po '(?<=TOKEN_CONTRACT_ID=)\S+' deployment.log || true)
          fi

          echo "governance-contract-id=${GOVERNANCE_CONTRACT_ID:-}" >> "$GITHUB_OUTPUT"
          echo "token-contract-id=${TOKEN_CONTRACT_ID:-}" >> "$GITHUB_OUTPUT"

          echo "✅ Deployment completed successfully"

      - name: Upload deployment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs-${{ github.run_id }}
          path: |
            deployment.log
            .env.testnet
          retention-days: 30

  # ── Write contract addresses back to config/testnet.toml ────────────────────
  # Satisfies acceptance criterion: "Deployed contract addresses written back to
  # config/testnet.toml via bot commit" (#266).
  update-config:
    name: Write Contract Addresses to config/testnet.toml
    runs-on: ubuntu-latest
    needs: deploy
    if: >-
      needs.deploy.outputs.governance-contract-id != '' ||
      needs.deploy.outputs.token-contract-id != ''
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update config/testnet.toml with deployed addresses
        env:
          GOVERNANCE_ID: ${{ needs.deploy.outputs.governance-contract-id }}
          TOKEN_ID: ${{ needs.deploy.outputs.token-contract-id }}
        run: |
          set -euo pipefail
          CONFIG="config/testnet.toml"

          if [[ -n "$GOVERNANCE_ID" ]]; then
            sed -i "s|^governance = .*|governance = \"$GOVERNANCE_ID\"|" "$CONFIG"
          fi
          if [[ -n "$TOKEN_ID" ]]; then
            sed -i "s|^token = .*|token = \"$TOKEN_ID\"|" "$CONFIG"
          fi

          echo "Updated $CONFIG:"
          cat "$CONFIG"

      - name: Commit updated testnet config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/testnet.toml
          if git diff --cached --quiet; then
            echo "No address changes to commit."
          else
            git commit -m "chore(testnet): update deployed contract addresses [skip ci]

Deployed from ${{ github.sha }} by the deploy-testnet workflow (#266)."
            git push origin HEAD:main
          fi

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Stellar CLI binary
        id: stellar-cli-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/stellar
          key: ${{ runner.os }}-stellar-cli-${{ env.STELLAR_CLI_VERSION }}

      - name: Install Stellar CLI
        if: steps.stellar-cli-cache.outputs.cache-hit != 'true'
        run: cargo install --locked stellar-cli@${{ env.STELLAR_CLI_VERSION }} --features opt

      - name: Verify contracts on testnet
        env:
          SOROBAN_ACCOUNT: ${{ secrets.SOROBAN_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "🔍 Verifying deployed contracts..."
          export SOROBAN_RPC_URL="https://soroban-testnet.stellar.org"
          export SOROBAN_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
          echo "📋 Contracts for account $SOROBAN_ACCOUNT:"
          stellar contract info --id "$SOROBAN_ACCOUNT" || echo "Contract verification requires additional setup"
          echo "✅ Verification complete"

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build, deploy, verify, update-config]
    if: always()
    steps:
      - name: Create status summary
        run: |
          echo "## Testnet Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI Gate | ${{ needs.ci.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Verify | ${{ needs.verify.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Update Config | ${{ needs.update-config.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Run:** [View logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack on success
        if: needs.deploy.result == 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification."
            exit 0
          fi
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"✅ *Testnet deployment succeeded*\",
              \"attachments\": [{
                \"color\": \"good\",
                \"fields\": [
                  {\"title\": \"Repository\", \"value\": \"${{ github.repository }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"short\": true},
                  {\"title\": \"Run\", \"value\": \"<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>\", \"short\": true}
                ]
              }]
            }"

      - name: Notify Slack on failure
        if: needs.deploy.result == 'failure' || needs.build.result == 'failure' || needs.ci.result == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL not configured — skipping Slack notification."
            exit 0
          fi
          curl -sf -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            --data "{
              \"text\": \"❌ *Testnet deployment FAILED*\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Repository\", \"value\": \"${{ github.repository }}\", \"short\": true},
                  {\"title\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"short\": true},
                  {\"title\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"short\": true},
                  {\"title\": \"Run\", \"value\": \"<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>\", \"short\": true}
                ]
              }]
            }"
