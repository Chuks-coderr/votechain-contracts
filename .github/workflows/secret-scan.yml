name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Only one scan per ref at a time; cancel in-progress runs on new pushes.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks — detect secrets
    runs-on: ubuntu-latest
    # Prevent the scan from being skipped if the job is triggered on a fork PR
    # (forks have no write access to secrets, so GITHUB_TOKEN is read-only).
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          # Fetch full history so gitleaks can scan all commits in the diff,
          # not just the HEAD snapshot.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          # Scan only the commits introduced by this PR / push, not the whole
          # repo history (which would be noise on an existing repo).
          args: detect --config .gitleaks.toml --source . --log-opts "${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || 'HEAD~1...HEAD' }}"
        env:
          # GITHUB_TOKEN is used by the action to post a check annotation on PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set to 'false' to fail the workflow when secrets are found (default).
          GITLEAKS_ENABLE_COMMENTS: true
