# Alerting rules for the VoteChain backend. (#66)
# Loaded by Prometheus via rule_files in prometheus.yml.

groups:
  - name: votechain-backend
    rules:
      - alert: HighApiLatencyP99
        expr: >
          histogram_quantile(
            0.99,
            sum(rate(votechain_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency above 2s"
          description: >
            The 99th percentile request latency has exceeded 2 seconds for
            5 minutes. Current value: {{ $value }}s.

      - alert: LowCacheHitRate
        expr: votechain_cache_hit_rate < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis cache hit rate below 50%"
          description: >
            The proposal cache hit rate has been below 50% for 10 minutes.
            Current value: {{ $value | humanizePercentage }}.

      # Alert: indexer lag — fires when a proposal on-chain finalise event takes
      # more than 5 minutes to appear in the indexer. Indicates the indexer is
      # falling behind the chain and governance state may be stale. (#264)
      - alert: IndexerLagHigh
        expr: indexer_event_lag_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Indexer event lag exceeds 5 minutes"
          description: >
            The indexer has not processed a finalise event for more than
            {{ $value | humanizeDuration }}. Governance proposal states shown
            in the UI may be stale. Investigate the indexer process immediately.
          runbook_url: "https://github.com/veracindarella/votechain-contracts/blob/main/docs/mainnet-runbook.md#indexer-lag"
