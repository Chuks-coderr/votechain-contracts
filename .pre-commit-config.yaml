# .pre-commit-config.yaml
# Run `pre-commit install` once after cloning to enable these hooks.
# Docs: https://pre-commit.com

repos:
  # ── General hygiene ────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: detect-private-key          # basic built-in key detector

  # ── Secret scanning (gitleaks) ─────────────────────────────────────────────
  # gitleaks detects hardcoded secrets before they reach the remote.
  # Custom rules for Stellar secret keys (S... 56-char base32 format) are
  # defined in .gitleaks.toml alongside this file.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]
